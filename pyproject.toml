[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "juanig"
version = "1.1.2"
description = "Download Instagram photos, carousels, videos, and Reels from a link."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan Cunha", email = "github@juancunhaa.dev" }]
keywords = ["instagram", "download", "cli", "media"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
]
dependencies = ["requests>=2.32"]

[project.urls]
Homepage = "https://github.com/JuanCunhaa-dev/juanig"
Releases = "https://github.com/JuanCunhaa-dev/juanig/releases"

[project.scripts]
juanig = "juanig.cli:main"

[tool.setuptools.packages.find]
include = ["juanig*"]

[tool.setuptools.package-data]
juanig = ["data/*"]
