name: Release assets

on:
  release:
    types: [published]

jobs:
  attach-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upload installer scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            installer/install.ps1 \
            installer/install.sh \
            AI-SETUP.md \
            AI-SETUP.pt-BR.md \
            --clobber
